name: Daily TWSE Top 100 Scan

on:
  schedule:
    # 台北時間週一至週五 15:30 (UTC 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Top 100 Stock Scanner
        run: python scan_top100.py

      - name: Commit and push top100.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add top100.json
          git diff --staged --quiet || git commit -m "chore: update daily top100.json"
          git push
